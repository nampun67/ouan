<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>May I Be Your Girlfriend?</title>
<style>
:root{--pink:#f9d8e6;--deep:#e98bb0;--text:#7b4960;--white:#fffafd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:var(--pink);color:var(--text)}
#app{position:relative;width:100%;height:100%;background:var(--pink);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .7s,transform .7s}
.hidden{opacity:0;pointer-events:none;transform:scale(.94)}
.gift-wrap{text-align:center}
.hint{margin-top:20px;font-size:15px;opacity:.75}
.box{width:170px;height:145px;position:relative;cursor:pointer;filter:drop-shadow(0 16px 22px rgba(126,65,91,.16));animation:float 2.5s ease-in-out infinite}
.box-body{position:absolute;left:5px;right:5px;bottom:0;height:102px;border-radius:18px;background:#f6b8d0;border:3px solid #ef9fbe}
.box-lid{position:absolute;left:-3px;right:-3px;top:26px;height:43px;border-radius:16px;background:#f8c5d9;border:3px solid #ef9fbe;z-index:3;transition:transform .8s cubic-bezier(.2,.9,.2,1)}
.box-ribbon-v{position:absolute;left:68px;top:0;width:34px;height:100%;background:#efa0bd;z-index:4;border-radius:4px}
.box-ribbon-h{position:absolute;left:0;right:0;top:52px;height:24px;background:#efa0bd;z-index:4}
.heart{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-45deg);width:34px;height:34px;background:#fff0f6;border-radius:5px}
.heart:before,.heart:after{content:"";position:absolute;width:34px;height:34px;background:#fff0f6;border-radius:50%}.heart:before{top:-17px;left:0}.heart:after{left:17px;top:0}
.open .box-lid{transform:translateY(-95px) rotate(-8deg)}
.open .heart{opacity:0;transition:.3s}
.card{width:min(92vw,560px);padding:38px 30px 34px;border-radius:30px;background:rgba(255,250,253,.9);border:2px solid rgba(255,255,255,.8);box-shadow:0 20px 55px rgba(130,67,94,.18);text-align:center;backdrop-filter:blur(8px);animation:pop .65s ease both}
.card h1{margin:0 0 10px;font-size:clamp(28px,7vw,48px);line-height:1.08;color:#d86d99}
.card p{margin:0 0 26px;font-size:17px;opacity:.82}
.buttons{display:flex;gap:14px;justify-content:center;align-items:center;min-height:58px}
button{border:0;border-radius:999px;padding:15px 28px;font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
#yes{background:#ee91b5;color:white;box-shadow:0 9px 18px rgba(218,102,146,.22)}
#no{background:white;color:#a96c85;border:2px solid #f1c5d7}
button:hover{transform:translateY(-2px)}
#flowers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flower{position:absolute;bottom:-80px;font-size:clamp(28px,6vw,58px);animation:rise var(--dur) ease-in forwards;animation-delay:var(--delay);transform:translateX(-50%) rotate(0deg);filter:drop-shadow(0 5px 7px rgba(112,67,85,.13))}
#success{z-index:4}
.success-card{animation:pop .7s ease both}
.success-card h2{font-size:clamp(30px,8vw,52px);margin:0 0 8px;color:#d86d99}
.success-card .big-heart{font-size:60px;animation:pulse 1.2s infinite}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pop{from{opacity:0;transform:scale(.75) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes rise{0%{bottom:-90px;opacity:0;transform:translateX(-50%) rotate(-15deg)}10%{opacity:1}100%{bottom:110%;opacity:0;transform:translateX(calc(-50% + var(--drift))) rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@media(max-width:500px){.card{padding:32px 20px}.buttons{gap:10px}button{padding:14px 22px}}
</style>
</head>
<body>
<div id="app">
  <section id="intro" class="screen">
    <div class="gift-wrap">
      <div id="box" class="box" aria-label="Open the heart box" role="button" tabindex="0">
        <div class="box-body"></div><div class="box-ribbon-v"></div><div class="box-ribbon-h"></div><div class="box-lid"></div><div class="heart"></div>
      </div>
      <div class="hint">tap the little heart box 💗</div>
    </div>
  </section>

  <section id="question" class="screen hidden">
    <div class="card">
      <h1>May I be your girlfriend?</h1>
      <p>Choose your answer 💗</p>
      <div class="buttons"><button id="yes">Yes 💕</button><button id="no">No 🙈</button></div>
    </div>
  </section>

  <section id="success" class="screen hidden">
    <div class="card success-card">
      <div class="big-heart">💗</div>
      <h2>Yayyy! 💐</h2>
      <p>Thank you for saying yes 🌷</p>
    </div>
  </section>
  <div id="flowers"></div>
</div>
<script>
const intro=document.getElementById('intro'),question=document.getElementById('question'),success=document.getElementById('success');
const box=document.getElementById('box'),yes=document.getElementById('yes'),no=document.getElementById('no'),flowers=document.getElementById('flowers');
let yesScale=1,opened=false;
function openBox(){if(opened)return;opened=true;box.classList.add('open');setTimeout(()=>{intro.classList.add('hidden');question.classList.remove('hidden')},650)}
box.addEventListener('click',openBox);box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openBox()});
no.addEventListener('click',()=>{yesScale=Math.min(4.8,yesScale+.55);yes.style.transform=`scale(${yesScale})`;yes.style.boxShadow='0 12px 25px rgba(218,102,146,.28)';if(yesScale>=3.5)no.style.opacity='.45'});
function launchFlowers(){const emojis=['🌸','🌷','🌹','🌼','🌺','💐','🌻','🪻','💗'];for(let i=0;i<75;i++){const f=document.createElement('span');f.className='flower';f.textContent=emojis[Math.floor(Math.random()*emojis.length)];f.style.left=(Math.random()*100)+'%';f.style.setProperty('--dur',(3.5+Math.random()*4)+'s');f.style.setProperty('--delay',(Math.random()*2.5)+'s');f.style.setProperty('--drift',((Math.random()-.5)*180)+'px');flowers.appendChild(f);setTimeout(()=>f.remove(),8500)}}
yes.addEventListener('click',()=>{question.classList.add('hidden');success.classList.remove('hidden');launchFlowers()});
</script>
</body>
</html>
